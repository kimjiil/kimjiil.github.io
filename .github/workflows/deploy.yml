name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, v4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 연속 푸시 시 이전 커밋의 배포가 최신 배포를 덮어쓰는 레이스 방지:
# 같은 그룹은 한 번에 하나씩 푸시 순서대로 실행 (진행 중 배포는 완주시킴)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
